<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategies</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background:#0d1117; color:#c9d1d9; margin:0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { color:#58a6ff; margin-bottom:6px; }
  .nav { display:flex; gap:10px; margin-bottom:16px; }
  .nav a { color:#58a6ff; text-decoration:none; }
  .nav a:hover { text-decoration:underline; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  .card { background:#161b22; border:1px solid #21262d; border-radius:8px; padding:14px; }
  .name { font-size:16px; font-weight:700; margin-bottom:6px; }
  .desc { font-size:12px; color:#8b949e; margin-bottom:10px; line-height:1.4; }
  .kv { font-size:12px; line-height:1.6; }
  .key { color:#8b949e; }
</style>
</head>
<body>
<div class="container">
  <h1>All Strategies</h1>
  <div class="nav">
    <a href="/">Overview</a>
    <a href="/strategies">Strategies</a>
    <a href="/trades">Trades Explorer</a>
    <select id="run-selector" style="background:#161b22; border:1px solid #30363d; color:#c9d1d9; padding:4px 8px; border-radius:6px; font-size:12px; margin-left:auto;">
      <option value="current">Loading runs...</option>
    </select>
  </div>
  <div id="meta" style="color:#8b949e; font-size:12px; margin-bottom:14px;">Loading...</div>
  <div id="cards" class="grid"></div>
</div>
<script>
let selectedRunId = 'current';

async function loadRuns() {
  try {
    const resp = await fetch('/api/runs');
    const d = await resp.json();
    const sel = document.getElementById('run-selector');
    const runs = d.runs || [];
    const currentId = d.current_run_id;
    sel.innerHTML = '';
    const currentRun = runs.find(r => r.run_id === currentId);
    const currentLabel = currentRun ? currentRun.label : 'Current';
    sel.innerHTML += `<option value="current">${currentLabel} (live)</option>`;
    runs.filter(r => r.status === 'archived').forEach(r => {
      sel.innerHTML += `<option value="${r.run_id}">${r.label} (archived)</option>`;
    });
    sel.value = selectedRunId;
  } catch (e) {}
}
document.getElementById('run-selector').addEventListener('change', function() {
  selectedRunId = this.value;
  load();
});

async function load() {
  let strategies;
  if (selectedRunId === 'current') {
    const r = await fetch('/api/strategies');
    const d = await r.json();
    strategies = d.strategies || [];
  } else {
    const r = await fetch(`/api/runs/${selectedRunId}/status`);
    const d = await r.json();
    strategies = (d.strategy_leaderboard || d.strategies || []).map(s => ({
      name: s.name,
      description: '',
      config: { exit_mode: s.exit_mode || '', sports: ['nba','mlb','nhl'] },
      live: {
        entries: s.entries || 0,
        exits: s.exits || 0,
        open_positions: s.open_positions || 0,
        realized_pl: s.realized_pl || 0,
        win_rate: s.win_rate || 0,
      },
    }));
  }
  document.getElementById('meta').textContent = `${strategies.length} strategies loaded`;
  const cards = document.getElementById('cards');
  cards.innerHTML = strategies.map(s => {
    const c = s.config || {};
    const l = s.live || {};
    return `<div class="card">
      <div class="name">${s.name}</div>
      <div class="desc">${s.description || ''}</div>
      <div class="kv">
        <div><span class="key">Mode:</span> ${c.exit_mode || '-'}</div>
        <div><span class="key">Sports:</span> ${(c.sports || []).join(', ')}</div>
        <div><span class="key">Underdog max:</span> ${c.underdog_max_price ?? '-'}</div>
        <div><span class="key">Sell pct:</span> ${c.min_sell_profit_pct ?? '-'}</div>
        <div><span class="key">Sell usd:</span> ${c.min_sell_profit_usd ?? '-'}</div>
        <div><span class="key">Lock pct:</span> ${c.min_lock_profit_pct ?? '-'}</div>
        <div><span class="key">Lock usd:</span> ${c.min_lock_profit_usd ?? '-'}</div>
        <hr style="border:0;border-top:1px solid #21262d;margin:8px 0;">
        <div><span class="key">Entries/exits:</span> ${l.entries ?? 0}/${l.exits ?? 0}</div>
        <div><span class="key">Open:</span> ${l.open_positions ?? 0}</div>
        <div><span class="key">Realized:</span> ${l.realized_pl ?? 0}</div>
        <div><span class="key">Win rate:</span> ${l.win_rate ?? 0}%</div>
      </div>
    </div>`;
  }).join('');
}
loadRuns();
load().catch(e => {
  document.getElementById('meta').textContent = `Error: ${e.message}`;
});
</script>
</body>
</html>
