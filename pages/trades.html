<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trades Explorer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background:#0d1117; color:#c9d1d9; margin:0; }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  h1 { color:#58a6ff; margin-bottom:6px; }
  .nav { display:flex; gap:10px; margin-bottom:16px; }
  .nav a { color:#58a6ff; text-decoration:none; }
  .nav a:hover { text-decoration:underline; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  select,input { background:#161b22; border:1px solid #30363d; color:#c9d1d9; padding:6px 8px; border-radius:6px; font-size:12px; }
  table { width:100%; border-collapse:collapse; background:#161b22; border:1px solid #21262d; font-size:12px; }
  th,td { padding:8px; border-top:1px solid #21262d; text-align:left; }
  th { background:#1c2128; color:#8b949e; cursor:pointer; }
  .muted { color:#8b949e; font-size:12px; margin-bottom:8px; }
  .pos { color:#3fb950; } .neg { color:#f85149; }
</style>
</head>
<body>
<div class="container">
  <h1>Trades Explorer</h1>
  <div class="nav">
    <a href="/">Overview</a>
    <a href="/strategies">Strategies</a>
    <a href="/trades">Trades Explorer</a>
    <select id="run-selector" style="background:#161b22; border:1px solid #30363d; color:#c9d1d9; padding:4px 8px; border-radius:6px; font-size:12px; margin-left:auto;">
      <option value="current">Loading runs...</option>
    </select>
  </div>
  <div class="toolbar">
    <select id="strategy"><option value="">All strategies</option></select>
    <select id="action">
      <option value="">All actions</option><option value="buy">buy</option>
      <option value="sell">sell</option><option value="lock">lock</option><option value="settle">settle</option>
    </select>
    <input id="ticker" placeholder="ticker contains">
    <input id="dateFrom" type="date">
    <input id="dateTo" type="date">
    <input id="minPl" type="number" step="0.01" placeholder="min p&l">
    <input id="maxPl" type="number" step="0.01" placeholder="max p&l">
    <label style="font-size:12px;"><input id="anomalies" type="checkbox"> anomalies only</label>
    <button id="apply">Apply</button>
  </div>
  <div class="muted" id="meta">Loading...</div>
  <table>
    <thead>
      <tr>
        <th data-sort="timestamp">Time</th><th data-sort="strategy">Strategy</th><th data-sort="action">Action</th>
        <th data-sort="team">Team</th><th>Ticker</th><th data-sort="price">Price</th><th data-sort="profit">P&L</th><th>Reason</th><th>Trigger</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
let sort='timestamp', order='desc';
let selectedRunId = 'current';
function fmt(v){ return (v>=0?'+':'')+'$'+Math.abs(v).toFixed(2); }

async function loadRuns() {
  try {
    const resp = await fetch('/api/runs');
    const d = await resp.json();
    const sel = document.getElementById('run-selector');
    const runs = d.runs || [];
    const currentId = d.current_run_id;
    sel.innerHTML = '';
    const currentRun = runs.find(r => r.run_id === currentId);
    const currentLabel = currentRun ? currentRun.label : 'Current';
    sel.innerHTML += `<option value="current">${currentLabel} (live)</option>`;
    runs.filter(r => r.status === 'archived').forEach(r => {
      sel.innerHTML += `<option value="${r.run_id}">${r.label} (archived)</option>`;
    });
    sel.value = selectedRunId;
  } catch (e) {}
}
document.getElementById('run-selector').addEventListener('change', function() {
  selectedRunId = this.value;
  loadTrades();
});

async function loadStrategies() {
  const r = await fetch('/api/strategies'); const d = await r.json();
  const sel = document.getElementById('strategy');
  (d.strategies||[]).forEach(s => {
    const o = document.createElement('option'); o.value=s.name; o.textContent=s.name; sel.appendChild(o);
  });
}
async function loadTrades() {
  const q = new URLSearchParams({
    limit:'2000', sort, order,
    strategy:document.getElementById('strategy').value,
    action:document.getElementById('action').value,
    ticker:document.getElementById('ticker').value.trim(),
    date_from:document.getElementById('dateFrom').value,
    date_to:document.getElementById('dateTo').value,
    min_pl:document.getElementById('minPl').value,
    max_pl:document.getElementById('maxPl').value,
    anomalies_only:document.getElementById('anomalies').checked ? '1' : '',
  });
  const url = selectedRunId === 'current' ? '/api/trades?' + q.toString() : `/api/runs/${selectedRunId}/trades?` + q.toString();
  const r = await fetch(url); const d = await r.json();
  document.getElementById('meta').textContent = `Showing ${d.count||0} rows (total ${d.total_count||0}) · sort ${sort} ${order}`;
  const body = document.getElementById('rows');
  body.innerHTML = (d.trades||[]).map(t => {
    const ts = t.timestamp ? new Date(t.timestamp*1000).toLocaleString() : '—';
    const px = t.display_price != null ? '$'+Number(t.display_price).toFixed(2) : '—';
    const pl = t.display_profit != null ? fmt(Number(t.display_profit)) : '—';
    const cls = t.display_profit == null ? '' : (Number(t.display_profit)>=0?'pos':'neg');
    return `<tr>
      <td>${ts}</td><td>${t.strategy||'—'}</td><td>${(t.action||'').toUpperCase()}</td>
      <td>${t.selected_team||'—'} ${t.anomaly_flag?'<span style="color:#f85149;">⚠</span>':''}</td>
      <td>${t.ticker||'—'}</td><td>${px}</td><td class="${cls}">${pl}</td><td>${t.exit_reason||'—'}</td><td>${t.trigger||'—'}</td>
    </tr>`;
  }).join('');
}
document.getElementById('apply').onclick = () => loadTrades();
document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
  const s = th.dataset.sort;
  if (sort === s) order = order === 'asc' ? 'desc' : 'asc';
  else { sort = s; order='desc'; }
  loadTrades();
});
loadRuns();
loadStrategies().then(loadTrades).catch(e => {
  document.getElementById('meta').textContent = `Error: ${e.message}`;
});
</script>
</body>
</html>
