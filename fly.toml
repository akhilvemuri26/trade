# Fly.io — paper trading worker + public dashboard
# App: https://kalshi-trader-crimson-darkness-7593.fly.dev/
#
# First-time setup:
#   fly volumes create trade_data --region sjc --size 1
#   fly secrets set TELEGRAM_BOT_TOKEN=xxx TELEGRAM_CHAT_ID=xxx
#   fly deploy

app = 'kalshi-trader-crimson-darkness-7593'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PLAIN_LOGS = 'true'
  EXECUTOR_URL = 'http://127.0.0.1:8100'
  TEST_DURATION = '0'
  PAPER_BALANCE = '200'
  # Production Run 7+: single strategy, $5/trade stake.
  STRATEGY_SET = 'prod'
  MAX_RISK_PER_TRADE = '5'
  MAX_POSITIONS = '40'
  # Run 5: stake frozen at the backtested $25 (was $50 in Run 4 — never drift
  # the stake from what was backtested).
  MAX_RISK_PER_TRADE = '5'
  MAX_TOTAL_RISK = '100000'
  # Run 5 exit modes (hold / take_profit) use fraction/percent thresholds, not
  # the USD swing thresholds PROFIT_SCALE scaled, so this is effectively unused.
  PROFIT_SCALE = '1.0'
  # Set to '1' once to archive everything and reset wallet to PAPER_BALANCE.
  # Run 6 launch: flip to '1' for the first deploy (archives Run 5, starts
  # Run 6), then back to '0' and redeploy so restarts resume instead of resetting.
  FRESH_EXPERIMENT = '0'
  EXIT_SCAN_INTERVAL = '30'
  # Run 5: ML entry gate OFF (it optimized win-rate, not EV, and fed the
  # winner-clipping). Re-enable only after the model is relabeled to predict EV.
  USE_MODEL_GATE = '0'
  MODEL_MIN_PROB = '0.6'
  # Run 6: re-entry guard + entry filters (defaults also baked into strategy_config).
  ONE_ENTRY_PER_GAME = '1'
  MIN_ENTRY_PRICE = '0.20'
  MIN_HOURS_TO_RESOLUTION = '3'

[mounts]
  source = 'trade_data'
  destination = '/data'

[processes]
  worker = 'python run_server.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['worker']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpus = 1
